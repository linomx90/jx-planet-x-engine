[build-system]
requires = ["setuptools==78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "jxplanetx"
version = "0.6.0rc8"
description = "Falsification-first general celestial-dynamics framework with explicit scientific claim controls"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-JX-Proprietary"
license-files = ["LICENSE", "AUTHORS.md", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Lino Avila"}]
keywords = ["celestial-mechanics", "n-body", "gpu", "force-models", "planet-x", "reproducibility"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Astronomy",
]

[project.optional-dependencies]
engine = ["numpy>=2,<3"]
gpu-cuda12 = ["numpy>=2,<3", "cupy-cuda12x[ctk]>=14,<15"]
gpu-cuda13 = ["numpy>=2,<3", "cupy-cuda13x[ctk]>=14,<15"]
rebound = ["rebound==4.4.11"]
ias15 = ["rebound==4.4.11"]
rebound-competition = ["rebound==5.1.1"]
independent = ["numpy==2.3.5", "scipy==1.17.0"]
llr-screen = ["numpy==2.3.5", "pyerfa==2.0.1.5", "spiceypy==8.2.0"]

[project.scripts]
jxplanetx = "jxplanetx.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[[tool.setuptools.ext-modules]]
name = "jxplanetx._smalln_cpu"
sources = [
  "src/jxplanetx/_smalln_cpu_module.c",
  "benchmarks/jx_smalln_cpu_rkf78.c",
]
libraries = ["m"]
extra-compile-args = ["-O3", "-g0", "-std=c11", "-fno-fast-math", "-ffp-contract=off"]

[[tool.setuptools.ext-modules]]
name = "jxplanetx._wisdom_holman_cpu"
sources = [
  "src/jxplanetx/_wisdom_holman_cpu_module.c",
  "src/jxplanetx/_wisdom_holman_loop.c",
]
libraries = ["m"]
extra-compile-args = ["-O3", "-g0", "-std=c11", "-fno-fast-math", "-ffp-contract=off"]

[[tool.setuptools.ext-modules]]
name = "jxplanetx._wisdom_holman_cpu_v2"
sources = [
  "src/jxplanetx/_wisdom_holman_cpu_v2_module.c",
  "src/jxplanetx/_wisdom_holman_loop_v2.c",
]
libraries = ["m"]
extra-compile-args = ["-O3", "-g0", "-std=c11", "-fno-fast-math", "-ffp-contract=off"]

[[tool.setuptools.ext-modules]]
name = "jxplanetx._wisdom_holman_cpu_v3"
sources = [
  "src/jxplanetx/_wisdom_holman_cpu_v3_module.c",
  "src/jxplanetx/_wisdom_holman_loop_v3.c",
]
libraries = ["m"]
extra-compile-args = ["-O3", "-g0", "-std=c11", "-fno-fast-math", "-ffp-contract=off"]

[[tool.setuptools.ext-modules]]
name = "jxplanetx._wisdom_holman_cpu_v4"
sources = [
  "src/jxplanetx/_wisdom_holman_cpu_v4_module.c",
  "src/jxplanetx/_wisdom_holman_loop_v4.c",
]
libraries = ["m"]
extra-compile-args = ["-O3", "-g0", "-std=c11", "-fno-fast-math", "-ffp-contract=off"]

[tool.setuptools.packages.find]
where = ["src"]
