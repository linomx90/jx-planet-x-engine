[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jxplanetx"
version = "0.1.1"
description = "Falsification-first scientific engine for outer-Solar-System gravity"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Lino Avila and JX Planet X contributors"}]
keywords = ["celestial-mechanics", "n-body", "planet-x", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Astronomy",
]

[project.optional-dependencies]
ias15 = ["rebound==4.4.11"]

[project.scripts]
jxplanetx = "jxplanetx.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
