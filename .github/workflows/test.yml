name: release-candidate

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-core:
    name: CPU core and optimized contracts
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Install core dependencies
        run: python -m pip install -e '.[independent]'
      - name: Run isolated engine modules
        run: |
          for test_path in tests/test_engine*.py; do
            python -m unittest discover -s tests -p "$(basename "$test_path")" -v
          done
      - name: Run isolated engine modules under optimized Python
        run: |
          for test_path in tests/test_engine*.py; do
            python -OO -m unittest discover -s tests -p "$(basename "$test_path")" -v
          done

  reproducible-packaging:
    name: Reproducible wheel and source archive
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Install the exact release build backend
        run: python -m pip install setuptools==78.1.1
      - name: Build twice and require byte-identical artifacts
        run: python tools/build_release.py --output-dir "$RUNNER_TEMP/jxplanetx-0.6.0rc10"
      - name: Smoke-test independent wheel and source installations
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/pip" install --no-deps "$RUNNER_TEMP"/jxplanetx-0.6.0rc10/*.whl
          python -m venv "$RUNNER_TEMP/sdist-smoke"
          "$RUNNER_TEMP/sdist-smoke/bin/pip" install setuptools==78.1.1
          "$RUNNER_TEMP/sdist-smoke/bin/pip" install --no-build-isolation --no-deps "$RUNNER_TEMP"/jxplanetx-0.6.0rc10/*.tar.gz
          for runtime in "$RUNNER_TEMP/wheel-smoke/bin/python" "$RUNNER_TEMP/sdist-smoke/bin/python"; do
            "$runtime" - <<'PY'
          import jxplanetx
          from jxplanetx.general_dynamics import registry_summary
          summary = registry_summary()
          from jxplanetx.gr15 import gr15_runtime_identity
          assert jxplanetx.__version__ == "0.6.0rc10"
          assert gr15_runtime_identity()["method_id"] == "JX_GAUSS_RADAU15_V3"
          assert gr15_runtime_identity()["scientific_claim_state"] == "SCREENING_ONLY"
          assert summary["version"] == "0.6.0rc3"
          assert summary["scientific_claim_state"] == "SCREENING_ONLY"
          assert summary["production_ready"] is False
          PY
            "$runtime" -m jxplanetx.cli --version
          done

  gr15:
    name: GR15 supported API and REBOUND screens
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Install GR15 comparison dependencies
        run: python -m pip install -e '.[independent,rebound-competition]'
      - name: Run supported GR15 gates
        run: |
          python -m unittest -v \
            tests.test_gr15 \
            tests.test_jx_gr15_ias15 \
            tests.test_jx_gr15_v3_candidate \
            tests.test_jx_gr15_v3_adversarial \
            tests.test_jx_gr15_rc10_acceptance \
            tests.test_jx_gr15_rc9_acceptance
