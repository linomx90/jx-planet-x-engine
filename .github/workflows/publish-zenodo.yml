name: Archive JX on Zenodo

on:
  push:
    branches:
      - main
    paths:
      - .github/publish-zenodo-v0.6.0rc8

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release metadata
        uses: actions/checkout@v4
        with:
          path: source

      - name: Check out verified release assets
        uses: actions/checkout@v4
        with:
          ref: release-assets/v0.6.0rc8
          path: assets
          sparse-checkout: release-assets/v0.6.0rc8
          sparse-checkout-cone-mode: false

      - name: Verify every archival file
        shell: bash
        run: |
          cd assets/release-assets/v0.6.0rc8
          sha256sum --check JX_0.6.0rc8_SHA256SUMS
          echo "c480b6c91394cac594369a8ed32bd82dcc10ae8cad4e566364bd4a9c66b6989e  jxplanetx-0.6.0rc8-cp314-cp314-manylinux_2_31_x86_64.whl" | sha256sum --check -
          echo "88ea71e6526ec5e9e2190e0ddf05ab3ff7a2f98e15258d65f7be402176556bbb  PYPI_ARTIFACTS_v0.6.0rc8.json" | sha256sum --check -

      - name: Create and publish the Zenodo software record
        shell: bash
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$ZENODO_ACCESS_TOKEN"
          api="https://zenodo.org/api"
          auth="Authorization: Bearer $ZENODO_ACCESS_TOKEN"
          legacy="source/.zenodo/jx-0.6.0rc8.json"

          jq '{
            access:{record:"public",files:"public"},
            files:{enabled:true},
            metadata:{
              title:.metadata.title,
              publication_date:.metadata.publication_date,
              resource_type:{id:"software"},
              creators:[.metadata.creators[] | {
                person_or_org:{
                  type:"personal",
                  family_name:(.name | split(", ")[0]),
                  given_name:(.name | split(", ")[1])
                }
              }],
              description:.metadata.description,
              rights:[{id:.metadata.license}],
              version:.metadata.version,
              subjects:[.metadata.keywords[] | {subject:.}]
            }
          }' "$legacy" > /tmp/rdm-metadata.json

          title="$(jq -er '.metadata.title' /tmp/rdm-metadata.json)"
          version="$(jq -er '.metadata.version' /tmp/rdm-metadata.json)"

          find_public_record() {
            curl --fail-with-body --silent --show-error \
              --retry 5 --retry-all-errors --retry-delay 5 --max-time 120 \
              --get --data-urlencode "size=100" \
              --data-urlencode "q=metadata.title:\"$title\"" \
              "$api/records" > /tmp/public-records.json
            jq -r --arg title "$title" --arg version "$version" \
              '[.hits.hits[]? | select(.metadata.title == $title and .metadata.version == $version)]
               | sort_by(.id) | last | .id // empty' /tmp/public-records.json
          }

          find_owned_draft() {
            curl --fail-with-body --silent --show-error \
              --retry 5 --retry-all-errors --retry-delay 5 --max-time 120 \
              --get -H "$auth" --data-urlencode "size=100" \
              --data-urlencode "q=metadata.title:\"$title\"" \
              "$api/user/records" > /tmp/user-records.json
            jq -r --arg title "$title" --arg version "$version" \
              '[.hits.hits[]? | select(.is_draft == true and .metadata.title == $title and .metadata.version == $version)]
               | sort_by(.id) | last | .id // empty' /tmp/user-records.json
          }

          published_id="$(find_public_record)"
          if [[ -n "$published_id" ]]; then
            jq -er --arg id "$published_id" \
              '.hits.hits[] | select((.id | tostring) == $id) | {
                id,doi,record_url:.links.self_html
              }' /tmp/public-records.json
            exit 0
          fi

          record_id="$(find_owned_draft)"
          if [[ -z "$record_id" ]]; then
            http_code="$(curl --silent --show-error --max-time 180 \
              -o /tmp/create-response.json -w '%{http_code}' \
              -X POST -H "$auth" -H "Content-Type: application/json" \
              --data-binary @/tmp/rdm-metadata.json "$api/records" || true)"
            if [[ "$http_code" == "200" || "$http_code" == "201" ]]; then
              record_id="$(jq -er '.id' /tmp/create-response.json)"
            elif [[ "$http_code" =~ ^5 ]]; then
              sleep 10
              record_id="$(find_owned_draft)"
            else
              cat /tmp/create-response.json
              echo "Zenodo draft creation failed with HTTP $http_code" >&2
              exit 1
            fi
          fi
          test -n "$record_id"
          echo "Using Zenodo draft $record_id"

          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 5 --max-time 120 \
            -X PUT -H "$auth" -H "Content-Type: application/json" \
            --data-binary @/tmp/rdm-metadata.json \
            "$api/records/$record_id/draft" > /tmp/draft.json

          for file in assets/release-assets/v0.6.0rc8/*; do
            name="$(basename "$file")"
            expected_size="$(stat -c %s "$file")"
            expected_md5="md5:$(md5sum "$file" | cut -d ' ' -f 1)"
            curl --fail-with-body --silent --show-error \
              --retry 5 --retry-all-errors --retry-delay 5 --max-time 120 \
              -H "$auth" "$api/records/$record_id/draft/files" > /tmp/files.json
            current="$(jq -c --arg name "$name" '.entries[]? | select(.key == $name)' /tmp/files.json)"
            if [[ -n "$current" ]] &&
               [[ "$(jq -r '.status' <<< "$current")" == "completed" ]] &&
               [[ "$(jq -r '.size' <<< "$current")" == "$expected_size" ]] &&
               [[ "$(jq -r '.checksum' <<< "$current")" == "$expected_md5" ]]; then
              echo "$name: already verified"
              continue
            fi
            if [[ -n "$current" ]]; then
              curl --fail-with-body --silent --show-error \
                -X DELETE -H "$auth" \
                "$api/records/$record_id/draft/files/$name" > /dev/null
            fi
            jq -n --arg key "$name" '[{key:$key}]' > /tmp/file-init.json
            curl --fail-with-body --silent --show-error \
              -X POST -H "$auth" -H "Content-Type: application/json" \
              --data-binary @/tmp/file-init.json \
              "$api/records/$record_id/draft/files" > /tmp/file-start.json
            curl --fail-with-body --silent --show-error \
              --retry 5 --retry-all-errors --retry-delay 5 --max-time 600 \
              -X PUT -H "$auth" -H "Content-Type: application/octet-stream" \
              --upload-file "$file" \
              "$api/records/$record_id/draft/files/$name/content" > /dev/null
            curl --fail-with-body --silent --show-error \
              -X POST -H "$auth" \
              "$api/records/$record_id/draft/files/$name/commit" > /tmp/file-commit.json
            jq -e --arg md5 "$expected_md5" --argjson size "$expected_size" \
              '.status == "completed" and .checksum == $md5 and .size == $size' \
              /tmp/file-commit.json > /dev/null
            echo "$name: uploaded and verified"
          done

          publish_url="$api/records/$record_id/draft/actions/publish"
          http_code="$(curl --silent --show-error --max-time 300 \
            -o /tmp/published.json -w '%{http_code}' \
            -X POST -H "$auth" "$publish_url" || true)"
          if [[ "$http_code" != "200" && "$http_code" != "201" && "$http_code" != "202" ]]; then
            published_id="$(find_public_record)"
            if [[ -z "$published_id" ]]; then
              cat /tmp/published.json
              echo "Zenodo publish failed with HTTP $http_code for draft $record_id" >&2
              exit 1
            fi
            curl --fail-with-body --silent --show-error \
              -H "$auth" "$api/records/$published_id" > /tmp/published.json
          fi
          jq -er '{
            id,
            doi:(.pids.doi.identifier // .doi),
            record_url:(.links.self_html // .links.record_html // .record_url)
          }' /tmp/published.json
