name: Archive JX on Zenodo

on:
  push:
    branches:
      - main
    paths:
      - .github/publish-zenodo-v0.6.0rc8

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release metadata
        uses: actions/checkout@v4
        with:
          path: source

      - name: Check out verified release assets
        uses: actions/checkout@v4
        with:
          ref: release-assets/v0.6.0rc8
          path: assets
          sparse-checkout: release-assets/v0.6.0rc8
          sparse-checkout-cone-mode: false

      - name: Verify every archival file
        shell: bash
        run: |
          cd assets/release-assets/v0.6.0rc8
          sha256sum --check JX_0.6.0rc8_SHA256SUMS
          echo "c480b6c91394cac594369a8ed32bd82dcc10ae8cad4e566364bd4a9c66b6989e  jxplanetx-0.6.0rc8-cp314-cp314-manylinux_2_31_x86_64.whl" | sha256sum --check -
          echo "88ea71e6526ec5e9e2190e0ddf05ab3ff7a2f98e15258d65f7be402176556bbb  PYPI_ARTIFACTS_v0.6.0rc8.json" | sha256sum --check -

      - name: Create and publish the Zenodo software record
        shell: bash
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$ZENODO_ACCESS_TOKEN"
          api="https://zenodo.org/api"
          auth="Authorization: Bearer $ZENODO_ACCESS_TOKEN"
          metadata="source/.zenodo/jx-0.6.0rc8.json"
          title="$(jq -er '.metadata.title' "$metadata")"
          version="$(jq -er '.metadata.version' "$metadata")"

          find_owned_deposition() {
            local status="$1"
            local response="/tmp/depositions-$status.json"
            curl --fail-with-body --silent --show-error \
              --retry 5 --retry-all-errors --retry-delay 5 --max-time 120 \
              --get -H "$auth" \
              --data-urlencode "status=$status" \
              --data-urlencode "size=100" \
              --data-urlencode "q=title:\"$title\"" \
              "$api/deposit/depositions" > "$response"
            jq -r --arg title "$title" --arg version "$version" \
              '[.[] | select(.metadata.title == $title and .metadata.version == $version)]
               | sort_by(.id) | last | .id // empty' "$response"
          }

          published_id="$(find_owned_deposition published)"
          if [[ -n "$published_id" ]]; then
            curl --fail-with-body --silent --show-error \
              --retry 5 --retry-all-errors --retry-delay 5 --max-time 120 \
              -H "$auth" "$api/deposit/depositions/$published_id" > /tmp/published.json
            jq -er '{id,doi,record_url:(.links.record_html // .record_url // .doi_url)}' /tmp/published.json
            exit 0
          fi

          deposition_id="$(find_owned_deposition draft)"
          if [[ -z "$deposition_id" ]]; then
            jq '{metadata:{upload_type:.metadata.upload_type,title:.metadata.title,version:.metadata.version}}' \
              "$metadata" > /tmp/create-request.json
            for attempt in 1 2 3 4 5; do
              http_code="$(curl --silent --show-error --max-time 120 \
                -o /tmp/create-response.json -w '%{http_code}' \
                -X POST -H "$auth" -H "Content-Type: application/json" \
                --data-binary @/tmp/create-request.json \
                "$api/deposit/depositions" || true)"
              if [[ "$http_code" == "201" ]]; then
                deposition_id="$(jq -er '.id' /tmp/create-response.json)"
                break
              fi
              if [[ "$http_code" =~ ^5 ]]; then
                sleep "$((attempt * 5))"
                deposition_id="$(find_owned_deposition draft)"
                [[ -n "$deposition_id" ]] && break
                continue
              fi
              cat /tmp/create-response.json
              echo "Zenodo create failed with HTTP $http_code" >&2
              exit 1
            done
          fi
          test -n "$deposition_id"
          echo "Using Zenodo deposition $deposition_id"

          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 5 --max-time 120 \
            -X PUT -H "$auth" -H "Content-Type: application/json" \
            --data-binary @"$metadata" \
            "$api/deposit/depositions/$deposition_id" > /tmp/deposition.json
          bucket="$(jq -er '.links.bucket' /tmp/deposition.json)"

          for file in assets/release-assets/v0.6.0rc8/*; do
            name="$(basename "$file")"
            curl --fail-with-body --silent --show-error \
              --retry 5 --retry-all-errors --retry-delay 5 --max-time 600 \
              -X PUT -H "$auth" -H "Content-Type: application/octet-stream" \
              --upload-file "$file" "$bucket/$name" > /dev/null
          done

          published=false
          for attempt in 1 2 3 4 5; do
            http_code="$(curl --silent --show-error --max-time 180 \
              -o /tmp/published.json -w '%{http_code}' \
              -X POST -H "$auth" \
              "$api/deposit/depositions/$deposition_id/actions/publish" || true)"
            if [[ "$http_code" == "200" || "$http_code" == "201" || "$http_code" == "202" ]]; then
              published=true
              break
            fi
            curl --fail-with-body --silent --show-error \
              --retry 5 --retry-all-errors --retry-delay 5 --max-time 120 \
              -H "$auth" "$api/deposit/depositions/$deposition_id" > /tmp/deposition-state.json
            if jq -e '.submitted == true or .state == "done"' /tmp/deposition-state.json > /dev/null; then
              cp /tmp/deposition-state.json /tmp/published.json
              published=true
              break
            fi
            if [[ "$http_code" =~ ^(409|5) ]]; then
              sleep "$((attempt * 10))"
              continue
            fi
            cat /tmp/published.json
            echo "Zenodo publish failed with HTTP $http_code for deposition $deposition_id" >&2
            exit 1
          done
          [[ "$published" == true ]]
          jq -er '{id,doi,record_url:(.links.record_html // .record_url // .doi_url)}' /tmp/published.json
