name: Archive JX on Zenodo

on:
  push:
    branches:
      - main
    paths:
      - .github/publish-zenodo-v0.6.0rc10

permissions:
  contents: read

concurrency:
  group: publish-zenodo-v0.6.0rc10
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release metadata
        uses: actions/checkout@v4
        with:
          path: source

      - name: Check out immutable release assets
        uses: actions/checkout@v4
        with:
          ref: 044035a6e72457e5477eeee2dfc224b3489a740a
          path: assets
          sparse-checkout: release-assets/v0.6.0rc10
          sparse-checkout-cone-mode: false

      - name: Verify every archival file
        shell: bash
        run: |
          set -euo pipefail
          cd assets/release-assets/v0.6.0rc10
          sha256sum --check JX_0.6.0rc10_SHA256SUMS
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 12
          test "$(jq -er '.source_release_commit' PYPI_ARTIFACTS_v0.6.0rc10.json)" = \
            "4d6866fe5e9b8a64c6924325baa233ca97e0afc3"

      - name: Create and publish the rc10 version of the Zenodo record
        shell: bash
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          trap 'echo "::error::Zenodo publication failed at shell line $LINENO"' ERR
          test -n "$ZENODO_ACCESS_TOKEN"
          ZENODO_ACCESS_TOKEN="$(printf '%s' "$ZENODO_ACCESS_TOKEN" | tr -d '\r\n')"
          test -n "$ZENODO_ACCESS_TOKEN"
          echo "Zenodo token is configured"

          api="https://zenodo.org/api"
          auth="Authorization: Bearer $ZENODO_ACCESS_TOKEN"
          native="application/vnd.inveniordm.v1+json"
          accept="Accept: $native"
          metadata="source/.zenodo/jx-0.6.0rc10.json"
          assets="assets/release-assets/v0.6.0rc10"
          anchor_id="22908602"
          expected_previous="0.6.0rc8"
          target_version="0.6.0rc10"

          jq '{
            access:{record:"public",files:"public"},
            files:{enabled:true},
            metadata:{
              title:.metadata.title,
              publication_date:.metadata.publication_date,
              resource_type:{id:"software"},
              creators:[.metadata.creators[] | {
                person_or_org:{
                  type:"personal",
                  family_name:(.name | split(", ")[0]),
                  given_name:(.name | split(", ")[1])
                }
              }],
              description:.metadata.description,
              publisher:.metadata.publisher,
              rights:[{id:.metadata.license}],
              version:.metadata.version,
              subjects:[.metadata.keywords[] | {subject:.}]
            }
          }' "$metadata" > /tmp/rdm-metadata.json
          echo "Zenodo rc10 metadata is valid"

          verify_public_files() {
            local record_json="$1"
            local expected_count
            expected_count="$(find "$assets" -maxdepth 1 -type f | wc -l)"
            test "$(jq '.files | length' "$record_json")" -eq "$expected_count"
            for file in "$assets"/*; do
              local name size md5
              name="$(basename "$file")"
              size="$(stat -c %s "$file")"
              md5="md5:$(md5sum "$file" | cut -d ' ' -f 1)"
              jq -e --arg name "$name" --arg md5 "$md5" --argjson size "$size" \
                'any(.files[]; .key == $name and .size == $size and .checksum == $md5)' \
                "$record_json" >/dev/null
            done
          }

          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 5 --max-time 120 \
            "$api/records/$anchor_id/versions/latest" > /tmp/latest-public.json
          latest_id="$(jq -er '.id' /tmp/latest-public.json)"
          latest_version="$(jq -er '.metadata.version' /tmp/latest-public.json)"
          echo "Latest public Zenodo version is $latest_version ($latest_id)"

          if [[ "$latest_version" == "$target_version" ]]; then
            verify_public_files /tmp/latest-public.json
            jq -er '{id,doi:(.pids.doi.identifier // .doi),url:(.links.self_html // .links.record_html)}' \
              /tmp/latest-public.json
            echo "Zenodo rc10 already exists and every public file is verified."
            exit 0
          fi
          if [[ "$latest_version" != "$expected_previous" ]]; then
            echo "Refusing to version unexpected latest Zenodo release: $latest_version ($latest_id)" >&2
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 5 --max-time 120 \
            -X POST -H "$auth" \
            "$api/deposit/depositions/$latest_id/actions/newversion" \
            > /tmp/new-version.json
          echo "New-version response link keys: $(jq -c '.links | keys' /tmp/new-version.json)"
          draft_url="$(jq -er '.links.latest_draft' /tmp/new-version.json)"
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 5 --max-time 120 \
            -H "$auth" "$draft_url" > /tmp/draft.json
          draft_id="$(jq -er '.id' /tmp/draft.json)"
          bucket="$(jq -er '.links.bucket' /tmp/draft.json)"
          echo "Using Zenodo new-version draft $draft_id from published record $latest_id"

          legacy_files_url="$draft_url/files"
          curl --fail-with-body --silent --show-error -H "$auth" "$legacy_files_url" \
            > /tmp/inherited-files.json
          jq -r --arg base "$legacy_files_url" \
            '.[] | (.links.self // ($base + "/" + (.id | tostring)))' \
            /tmp/inherited-files.json | while IFS= read -r file_url; do
            curl --fail-with-body --silent --show-error -X DELETE -H "$auth" "$file_url" \
              >/dev/null
          done

          rdm_draft_url="$api/records/$draft_id/draft"
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 5 --max-time 120 \
            -X PUT -H "$auth" -H "$accept" -H "Content-Type: application/json" \
            --data-binary @/tmp/rdm-metadata.json "$rdm_draft_url" > /tmp/updated-draft.json
          test "$(jq -er '.metadata.version' /tmp/updated-draft.json)" = "$target_version"
          files_url="$(jq -er '.links.files' /tmp/updated-draft.json)"
          publish_url="$(jq -er '.links.publish' /tmp/updated-draft.json)"

          for file in "$assets"/*; do
            name="$(basename "$file")"
            expected_size="$(stat -c %s "$file")"
            expected_md5="md5:$(md5sum "$file" | cut -d ' ' -f 1)"
            curl --fail-with-body --silent --show-error \
              --retry 5 --retry-all-errors --retry-delay 5 --max-time 600 \
              -X PUT -H "$auth" -H "Content-Type: application/octet-stream" \
              --data-binary "@$file" "$bucket/$name" > /tmp/file-upload.json
            jq -e --arg md5 "$expected_md5" --argjson size "$expected_size" \
              '.checksum == $md5 and .size == $size' /tmp/file-upload.json >/dev/null
            echo "$name: uploaded and verified"
          done

          curl --fail-with-body --silent --show-error -H "$auth" -H "$accept" \
            "$files_url" > /tmp/uploaded-files.json
          test "$(jq '.entries | length' /tmp/uploaded-files.json)" -eq \
            "$(find "$assets" -maxdepth 1 -type f | wc -l)"

          publish_http="$(curl --silent --show-error --max-time 300 \
            -o /tmp/published.json -w '%{http_code}' \
            -X POST -H "$auth" -H "$accept" "$publish_url" || true)"
          if [[ "$publish_http" != "200" && "$publish_http" != "201" && "$publish_http" != "202" ]]; then
            curl --fail-with-body --silent --show-error \
              --retry 8 --retry-all-errors --retry-delay 5 --max-time 120 \
              "$api/records/$draft_id" > /tmp/published.json
          fi
          published_id="$(jq -er '.id' /tmp/published.json)"
          test "$published_id" = "$draft_id"

          curl --fail-with-body --silent --show-error \
            --retry 8 --retry-all-errors --retry-delay 5 --max-time 120 \
            "$api/records/$published_id" > /tmp/public-rc10.json
          test "$(jq -er '.metadata.version' /tmp/public-rc10.json)" = "$target_version"
          verify_public_files /tmp/public-rc10.json
          jq -er '{id,doi:(.pids.doi.identifier // .doi),url:(.links.self_html // .links.record_html)}' \
            /tmp/public-rc10.json
