name: Archive JX on Zenodo

on:
  push:
    branches:
      - main
    paths:
      - .github/publish-zenodo-v0.6.0rc8

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release metadata
        uses: actions/checkout@v4
        with:
          path: source

      - name: Check out verified release assets
        uses: actions/checkout@v4
        with:
          ref: release-assets/v0.6.0rc8
          path: assets
          sparse-checkout: release-assets/v0.6.0rc8
          sparse-checkout-cone-mode: false

      - name: Verify every archival file
        shell: bash
        run: |
          cd assets/release-assets/v0.6.0rc8
          sha256sum --check JX_0.6.0rc8_SHA256SUMS
          echo "c480b6c91394cac594369a8ed32bd82dcc10ae8cad4e566364bd4a9c66b6989e  jxplanetx-0.6.0rc8-cp314-cp314-manylinux_2_31_x86_64.whl" | sha256sum --check -
          echo "88ea71e6526ec5e9e2190e0ddf05ab3ff7a2f98e15258d65f7be402176556bbb  PYPI_ARTIFACTS_v0.6.0rc8.json" | sha256sum --check -

      - name: Create and publish the Zenodo software record
        shell: bash
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$ZENODO_ACCESS_TOKEN"
          api="https://zenodo.org/api"
          auth="Authorization: Bearer $ZENODO_ACCESS_TOKEN"
          native="application/vnd.inveniordm.v1+json"
          accept="Accept: $native"
          legacy="source/.zenodo/jx-0.6.0rc8.json"

          jq '{
            access:{record:"public",files:"public"},
            files:{enabled:true},
            metadata:{
              title:.metadata.title,
              publication_date:.metadata.publication_date,
              resource_type:{id:"software"},
              creators:[.metadata.creators[] | {
                person_or_org:{
                  type:"personal",
                  family_name:(.name | split(", ")[0]),
                  given_name:(.name | split(", ")[1])
                }
              }],
              description:.metadata.description,
              rights:[{id:.metadata.license}],
              version:.metadata.version,
              subjects:[.metadata.keywords[] | {subject:.}]
            }
          }' "$legacy" > /tmp/rdm-metadata.json

          title="$(jq -er '.metadata.title' /tmp/rdm-metadata.json)"
          version="$(jq -er '.metadata.version' /tmp/rdm-metadata.json)"

          find_public_record() {
            curl --fail-with-body --silent --show-error \
              --retry 5 --retry-all-errors --retry-delay 5 --max-time 120 \
              --get --data-urlencode "size=100" \
              --data-urlencode "q=metadata.title:\"$title\"" \
              "$api/records" > /tmp/public-records.json
            jq -r --arg title "$title" --arg version "$version" \
              '[.hits.hits[]? | select(.metadata.title == $title and .metadata.version == $version)]
               | sort_by(.id) | last | .id // empty' /tmp/public-records.json
          }

          find_owned_draft() {
            curl --fail-with-body --silent --show-error \
              --retry 5 --retry-all-errors --retry-delay 5 --max-time 120 \
              --get -H "$auth" -H "$accept" --data-urlencode "size=100" \
              "$api/user/records" > /tmp/user-records.json
            jq -r --arg title "$title" --arg version "$version" \
              '[.hits.hits[]? | select(
                (.is_draft == true or .is_published == false or .status == "draft") and
                .metadata.title == $title and .metadata.version == $version
              )] | sort_by(.id) | last | .id // empty' /tmp/user-records.json
          }



          # Recovery is pinned after ambiguous legacy API failures created hidden drafts.
          # Never create another draft automatically for this release.
          record_id="22908602"
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 5 --max-time 120 \
            -H "$auth" -H "$accept" \
            "$api/records/$record_id/draft" > /tmp/existing-draft.json
          echo "Using pinned Zenodo draft $record_id"

          python3 - "$api/records/$record_id/draft" /tmp/rdm-metadata.json > /tmp/draft.json <<'PY'
          import os
          import pathlib
          import sys
          import urllib.error
          import urllib.request
          url, payload_path = sys.argv[1:3]
          payload = pathlib.Path(payload_path).read_bytes()
          request = urllib.request.Request(
              url,
              data=payload,
              method="PUT",
              headers={
                  "Authorization": f"Bearer {os.environ['ZENODO_ACCESS_TOKEN']}",
                  "Accept": "application/vnd.inveniordm.v1+json",
                  "Content-Type": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=120) as response:
                  sys.stdout.buffer.write(response.read())
          except urllib.error.HTTPError as error:
              sys.stderr.buffer.write(error.read())
              raise SystemExit(f"Zenodo metadata update failed with HTTP {error.code}")
          PY
          files_url="$(jq -er '.links.files' /tmp/draft.json)"
          publish_url="$(jq -er '.links.publish' /tmp/draft.json)"
          echo "Zenodo draft links accepted for $record_id: files=$files_url publish=$publish_url"

          legacy_http="$(curl --silent --show-error --max-time 120 \
            -o /tmp/legacy-draft.json -w '%{http_code}' \
            -H "$auth" "$api/deposit/depositions/$record_id" || true)"
          if [[ "$legacy_http" != "200" ]]; then
            cat /tmp/legacy-draft.json
            echo "Zenodo bucket discovery failed with HTTP $legacy_http for draft $record_id" >&2
            exit 1
          fi
          bucket="$(jq -er '.links.bucket' /tmp/legacy-draft.json)"
          echo "Zenodo bucket discovered for pinned draft $record_id"

          for file in assets/release-assets/v0.6.0rc8/*; do
            name="$(basename "$file")"
            expected_size="$(stat -c %s "$file")"
            expected_md5="md5:$(md5sum "$file" | cut -d ' ' -f 1)"
            python3 - "$file" "$bucket/$name" > /tmp/file-upload.json <<'PY'
          import os
          import pathlib
          import sys
          import urllib.error
          import urllib.request
          path, url = sys.argv[1:3]
          payload = pathlib.Path(path).read_bytes()
          request = urllib.request.Request(
              url,
              data=payload,
              method="PUT",
              headers={
                  "Authorization": f"Bearer {os.environ['ZENODO_ACCESS_TOKEN']}",
                  "Content-Type": "application/octet-stream",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=600) as response:
                  sys.stdout.buffer.write(response.read())
          except urllib.error.HTTPError as error:
              sys.stderr.buffer.write(error.read())
              raise SystemExit(f"Zenodo bucket upload failed with HTTP {error.code}")
          PY
            jq -e --arg md5 "$expected_md5" --argjson size "$expected_size" \
              '.checksum == $md5 and .size == $size' /tmp/file-upload.json > /dev/null
            echo "$name: uploaded and verified"
          done

          http_code="$(curl --silent --show-error --max-time 300 \
            -o /tmp/published.json -w '%{http_code}' \
            -X POST -H "$auth" -H "$accept" "$publish_url" || true)"
          if [[ "$http_code" != "200" && "$http_code" != "201" && "$http_code" != "202" ]]; then
            verify_http="$(curl --silent --show-error --max-time 120 \
              -o /tmp/published.json -w '%{http_code}' \
              -H "$accept" "$api/records/$record_id" || true)"
            if [[ "$verify_http" != "200" ]]; then
              cat /tmp/published.json
              echo "Zenodo publish failed with HTTP $http_code for draft $record_id" >&2
              exit 1
            fi
          fi
          jq -er '{
            id,
            doi:(.pids.doi.identifier // .doi),
            record_url:(.links.self_html // .links.record_html // .record_url)
          }' /tmp/published.json
