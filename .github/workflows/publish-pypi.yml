name: Publish JX to PyPI

on:
  push:
    branches:
      - main
    paths:
      - .github/publish-pypi-v0.6.0rc16

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out verified release assets
        uses: actions/checkout@v4
        with:
          ref: 5e7a6938cd00a3e4678eb707bac4870dbdfffecc
          path: assets
          sparse-checkout: release-assets/v0.6.0rc16
          sparse-checkout-cone-mode: false

      - name: Reassemble, verify, and select exact distributions
        shell: bash
        run: |
          set -euo pipefail
          asset_dir="$GITHUB_WORKSPACE/assets/release-assets/v0.6.0rc16"
          dist="$GITHUB_WORKSPACE/dist"
          mkdir -p "$dist"

          test "$(find "$asset_dir/pypi/chunks/wheel" -maxdepth 1 -type f | wc -l)" -eq 16
          test "$(find "$asset_dir/chunks/sdist" -maxdepth 1 -type f | wc -l)" -eq 13
          cat "$asset_dir"/pypi/chunks/wheel/part-* > \
            "$dist/jxplanetx-0.6.0rc16-cp314-cp314-manylinux_2_31_x86_64.whl"
          cat "$asset_dir"/chunks/sdist/part-* > \
            "$dist/jxplanetx-0.6.0rc16.tar.gz"
          cp "$asset_dir/PYPI_ASSEMBLY.json" "$dist/"
          cp "$asset_dir/PYPI_ARTIFACTS_v0.6.0rc16.json" "$dist/"

          cd "$dist"
          echo "522c7cd8976e76f04fe73a012f5335136fb0b0c472298f07e494692efeb9a2b4  jxplanetx-0.6.0rc16-cp314-cp314-manylinux_2_31_x86_64.whl" | sha256sum --check -
          echo "8f0a9964fca26acf0ba2cc7ab887b63c5544cc45be850fd43bdca8d41722e4b0  jxplanetx-0.6.0rc16.tar.gz" | sha256sum --check -
          test "$(jq -er '.source_release_commit' PYPI_ARTIFACTS_v0.6.0rc16.json)" = \
            "256de6e24915d630b6fd69b666f4aa6f78354523"
          test "$(jq -er '.version' PYPI_ASSEMBLY.json)" = "0.6.0rc16"
          test "$(jq -er '.repair.platform_tag' PYPI_ARTIFACTS_v0.6.0rc16.json)" = \
            "manylinux_2_31_x86_64"

          find . -maxdepth 1 -type f \
            ! -name 'jxplanetx-0.6.0rc16-cp314-cp314-manylinux_2_31_x86_64.whl' \
            ! -name 'jxplanetx-0.6.0rc16.tar.gz' -delete

      - name: Publish exact distributions with attestations
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
