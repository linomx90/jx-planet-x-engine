name: Publish JX 0.6.0rc8

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.6.0rc8.yml

permissions:
  contents: write

concurrency:
  group: publish-jx-v0.6.0rc8
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the immutable release source
        uses: actions/checkout@v4
        with:
          ref: e99dd12b7f551c050480398920660f701e102c3f
          path: source
          fetch-depth: 0

      - name: Check out the verified release assets
        uses: actions/checkout@v4
        with:
          ref: release-assets/v0.6.0rc8
          path: assets
          sparse-checkout: release-assets/v0.6.0rc8
          sparse-checkout-cone-mode: false

      - name: Verify every release asset
        shell: bash
        run: |
          cd assets/release-assets/v0.6.0rc8
          sha256sum --check JX_0.6.0rc8_SHA256SUMS
          echo "c480b6c91394cac594369a8ed32bd82dcc10ae8cad4e566364bd4a9c66b6989e  jxplanetx-0.6.0rc8-cp314-cp314-manylinux_2_31_x86_64.whl" | sha256sum --check -

      - name: Create the annotated tag and GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd source
          if ! git rev-parse --verify refs/tags/v0.6.0rc8 >/dev/null 2>&1; then
            git config user.name "linomx90"
            git config user.email "33378469+linomx90@users.noreply.github.com"
            git tag --annotate v0.6.0rc8 e99dd12b7f551c050480398920660f701e102c3f --message "JX General Dynamics 0.6.0rc8"
            git push origin refs/tags/v0.6.0rc8
          fi
          cd "$GITHUB_WORKSPACE"
          if gh release view v0.6.0rc8 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v0.6.0rc8 already exists; leaving it unchanged."
            exit 0
          fi
          gh release create v0.6.0rc8 \
            assets/release-assets/v0.6.0rc8/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "JX General Dynamics 0.6.0rc8" \
            --notes-file source/RELEASE_NOTES.md

      - name: Attach PyPI-compatible wheel and provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.6.0rc8 \
            assets/release-assets/v0.6.0rc8/jxplanetx-0.6.0rc8-cp314-cp314-manylinux_2_31_x86_64.whl \
            assets/release-assets/v0.6.0rc8/PYPI_ARTIFACTS_v0.6.0rc8.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
