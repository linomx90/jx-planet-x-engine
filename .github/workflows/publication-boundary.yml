name: publication-boundary

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-source-boundary:
    name: Public source boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Reject secrets, private paths, archives, binaries, and bulk files
        run: python tools/check_publication_boundary.py --root .
